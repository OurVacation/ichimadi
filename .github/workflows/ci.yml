# CI: PR 과 dev/main push 때 바뀐 쪽(backend / frontend / deploy)만 검사한다.
# 브랜치 보호의 "필수 체크"는 맨 아래 ci-result 하나만 걸면 된다.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

# 같은 PR 에 새 커밋이 올라오면 이전 실행은 취소한다. push 는 커밋마다 끝까지 검사한다.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read # paths-filter 가 PR 의 변경 파일 목록을 읽을 때 필요

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'content/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'content/**'
              - 'deploy/web.Dockerfile*'
              - '.github/workflows/ci.yml'
            deploy:
              - 'compose.prod.yml'
              - 'Caddyfile'
              - 'deploy/**'
              - '.github/workflows/ci.yml'

  backend:
    name: backend (ruff + pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DB 테스트(conftest.py)는 ichimadi_test DB 를 직접 만들고 마이그레이션한다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ichimadi
          POSTGRES_PASSWORD: ichimadi
          POSTGRES_DB: ichimadi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ichimadi -d ichimadi"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ichimadi:ichimadi@localhost:5432/ichimadi_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # Dockerfile 이 깨지지 않았는지 빌드만 해 본다 (push 하지 않음)
      - uses: docker/setup-buildx-action@v4
      - name: Docker build check (api)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=api

  frontend:
    name: frontend (test + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # package.json 의 `node --test tests/` 는 Linux 에서 폴더를 파일로 읽어 실패한다. 파일 패턴으로 직접 실행한다.
      - name: Test
        run: node --test "tests/**/*.test.ts"
      - name: Build (tsc + vite)
        run: npm run build
      - uses: docker/setup-buildx-action@v4
      - name: Docker build check (web)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web

  deploy-config:
    name: deploy config (validate)
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Caddyfile 문법 검사
        run: |
          docker run --rm -e SITE_ADDRESS=ci.example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: compose.prod.yml 검사 (예시 .env 사용)
        run: |
          cp deploy/.env.example .env
          docker compose -f compose.prod.yml config --quiet
      - name: 배포 스크립트 검사 (shellcheck)
        run: shellcheck deploy/remote-deploy.sh

  # 브랜치 보호에서 "필수 체크"로 지정하는 job.
  # 건너뛴(skipped) job 은 통과로 보고, 실패/취소가 하나라도 있으면 실패한다.
  ci-result:
    name: ci-result
    if: always()
    needs: [changes, backend, frontend, deploy-config]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::CI 실패: 위 job 결과를 확인하세요."
              exit 1
            fi
          done
